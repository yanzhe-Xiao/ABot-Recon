[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abot-recon"
version = "0.1.0"
description = "Anchor-free streaming 3D reconstruction for long videos"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
classifiers = ["License :: OSI Approved :: Apache Software License"]
dependencies = [
  "einops>=0.7",
  "huggingface-hub>=0.34,<1.0",
  "numpy>=1.24",
  "omegaconf>=2.3",
  "pillow>=9.5",
  "safetensors>=0.4",
  "torch==2.5.1",
  "torchvision==0.20.1",
  "tqdm>=4.66",
]

[project.optional-dependencies]
loop = ["faiss-cpu>=1.8", "opencv-python>=4.8", "pypose>=0.6", "scipy>=1.10"]
streaming = [
  "fastapi>=0.110",
  "open3d>=0.18",
  "opencv-python>=4.8",
  "requests>=2.31",
  "ultralytics>=8.2",
  "uvicorn>=0.28",
  "websockets>=12.0",
]
fusion = [
  "faiss-cpu>=1.8",
  "open3d>=0.18",
  "pypose>=0.6",
  "scikit-learn>=1.3",
  "scipy>=1.10",
]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]
all = [
  "faiss-cpu>=1.8",
  "fastapi>=0.110",
  "ninja>=1.11",
  "open3d>=0.18",
  "opencv-python>=4.8",
  "pypose>=0.6",
  "requests>=2.31",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "ultralytics>=8.2",
  "uvicorn>=0.28",
  "websockets>=12.0",
]

[project.scripts]
abot-recon = "abot_recon.cli:main"

[tool.setuptools.packages.find]
include = ["abot_recon*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
