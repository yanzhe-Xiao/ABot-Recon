<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABot-Recon 3D 实时流式建图与点云交互可视化系统</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --panel-bg: rgba(22, 27, 34, 0.88);
      --panel-border: rgba(255, 255, 255, 0.12);
      --accent-color: #3b82f6;
      --accent-hover: #60a5fa;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--text-main);
    }

    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* 顶部导航标题栏 */
    .top-bar {
      position: absolute;
      top: 16px;
      left: 20px;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--panel-bg);
      backdrop-filter: blur(14px);
      padding: 10px 20px;
      border-radius: 12px;
      border: 1px solid var(--panel-border);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .top-bar h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #60a5fa, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .badge {
      font-size: 11px;
      padding: 3px 8px;
      background: rgba(59, 130, 246, 0.2);
      color: #93c5fd;
      border: 1px solid rgba(59, 130, 246, 0.3);
      border-radius: 6px;
      font-weight: 600;
    }

    .badge-live {
      display: none;
      font-size: 11px;
      padding: 3px 10px;
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.4);
      border-radius: 6px;
      font-weight: 700;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.6; }
      50% { opacity: 1; }
      100% { opacity: 0.6; }
    }

    /* 侧边控制面板 */
    .control-panel {
      position: absolute;
      top: 16px;
      right: 20px;
      width: 340px;
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      z-index: 100;
      background: var(--panel-bg);
      backdrop-filter: blur(14px);
      border-radius: 14px;
      border: 1px solid var(--panel-border);
      padding: 18px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.45);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .control-panel::-webkit-scrollbar {
      width: 6px;
    }
    .control-panel::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
    }

    .panel-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .section-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      font-weight: 700;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .control-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }

    .control-row label {
      color: var(--text-main);
    }

    .control-row .val {
      font-size: 12px;
      color: #60a5fa;
      font-family: monospace;
    }

    select, input[type="file"], button {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--panel-border);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    select:hover, button:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--accent-color);
    }

    select option {
      background: #1f2937;
      color: #fff;
    }

    input[type="range"] {
      width: 100%;
      height: 5px;
      accent-color: var(--accent-color);
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.15);
      outline: none;
      cursor: pointer;
    }

    .btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn-group-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
    }

    button.btn-primary {
      background: var(--accent-color);
      color: white;
      font-weight: 600;
      border: none;
    }

    button.btn-primary:hover {
      background: var(--accent-hover);
    }

    button.btn-stream {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: white;
      font-weight: 700;
      border: none;
      box-shadow: 0 4px 14px rgba(239, 68, 68, 0.35);
    }

    button.btn-stream:hover {
      filter: brightness(1.1);
    }

    button.btn-stream.running {
      background: linear-gradient(135deg, #f59e0b, #d97706);
    }

    /* 进度条 */
    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 4px;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #3b82f6, #10b981);
      transition: width 0.1s ease;
    }

    .view-btn {
      font-size: 12px;
      padding: 6px;
      text-align: center;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      cursor: pointer;
    }

    .checkbox-row input {
      accent-color: var(--accent-color);
      cursor: pointer;
    }

    /* 统计信息 */
    .stats-card {
      background: rgba(0, 0, 0, 0.35);
      padding: 10px;
      border-radius: 8px;
      font-size: 12px;
      font-family: monospace;
      color: #93c5fd;
      display: flex;
      flex-direction: column;
      gap: 4px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    /* 实时 2D 摄像头 HUD (严格锁定左下角) */
    .camera-hud {
      position: fixed !important;
      bottom: 20px !important;
      left: 20px !important;
      right: auto !important;
      top: auto !important;
      z-index: 1000 !important;
      background: var(--panel-bg);
      backdrop-filter: blur(14px);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      overflow: hidden;
      width: 250px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      transition: all 0.3s ease;
    }

    .camera-hud-header {
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      background: rgba(0, 0, 0, 0.35);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .camera-hud img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      background: #000;
      display: block;
    }

    /* 操作提示栏 (位于 HUD 右侧并排显示) */
    .help-bar {
      position: fixed !important;
      bottom: 20px !important;
      left: 285px !important;
      z-index: 900 !important;
      background: var(--panel-bg);
      backdrop-filter: blur(14px);
      padding: 8px 16px;
      border-radius: 10px;
      border: 1px solid var(--panel-border);
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      gap: 14px;
      align-items: center;
    }

    .help-item span {
      display: inline-block;
      padding: 2px 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      color: #e5e7eb;
      font-weight: bold;
      margin-right: 4px;
    }

    /* 轻量浮动状态气泡 (替代全屏阻塞遮罩) */
    #status-toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      background: rgba(31, 41, 55, 0.95);
      backdrop-filter: blur(10px);
      border: 1px solid var(--accent-color);
      color: #e5e7eb;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      display: none;
      align-items: center;
      gap: 8px;
      transition: opacity 0.3s ease;
    }
  </style>
  <!-- Three.js 与 OrbitControls (本地加载，CDN 备份) -->
  <script src="/viewer/libs/three.min.js"></script>
  <script src="/viewer/libs/OrbitControls.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <!-- 轻量状态气泡 -->
  <div id="status-toast">
    <span id="toast-text">准备就绪</span>
  </div>

  <!-- 顶部状态栏 -->
  <div class="top-bar">
    <h1>ABot-Recon 3D 实时流式建图系统</h1>
    <span class="badge" id="backend-badge">FlashInfer Paged KV</span>
    <span class="badge-live" id="live-indicator">● LIVE STREAMING</span>
  </div>

  <!-- 侧边交互控制器 -->
  <div class="control-panel">
    
    <!-- 实时流式建图模块 -->
    <div class="panel-section" style="border: 1px solid rgba(239, 68, 68, 0.3); padding: 12px; border-radius: 10px; background: rgba(239, 68, 68, 0.05);">
      <div class="section-title" style="color:#f87171; border-color:rgba(239,68,68,0.2);">
        <span>🔴 实时视频流建图 (Live Stream)</span>
      </div>

      <div class="control-group">
        <label style="font-size:12px; color:var(--text-muted);">📹 选择建图数据源 (outputs 点云或视频流)</label>
        <select id="stream-sequence-select">
          <option value="outputs/16_1/frames" selected>📹 视频 1 (data/16/1.mp4 抽帧 - 157 帧)</option>
          <option value="outputs/16_2/frames">📹 视频 2 (data/16/2.mp4 抽帧 - 155 帧)</option>
          <option value="outputs/16_3/frames">📹 视频 3 (data/16/3.mp4 抽帧 - 150 帧)</option>
          <option value="data/data/05" selected>📹 视频流 05 (A-B-C-B-A 循环全景 - 643 帧)</option>
          <option value="data/data/06">📹 视频流 06 (C-D 右侧视角 - 307 帧)</option>
          <option value="data/data/07">📹 视频流 07 (B-D 主干基准视角 - 390 帧)</option>
          <option value="data/data/08">📹 视频流 08 (C-D 左侧视角 - 249 帧)</option>
          <option value="data/mine/VID20260903181931">📹 用户实拍视频 1 (走廊流式 VID181931 - 316 帧)</option>
          <option value="data/mine/VID20260903182041">📹 用户实拍视频 2 (走廊流式 VID182041 - 295 帧)</option>
          <option value="data/tum/rgbd_dataset_freiburg1_desk/rgb">🖥️ TUM 办公桌面全景 (Desk - 613 帧)</option>
          <option value="data/tum/rgbd_dataset_freiburg1_xyz/rgb">📐 TUM 空间平移序列 (XYZ - 798 帧)</option>
          <option value="data/tum/rgbd_dataset_freiburg1_360/rgb">🔄 TUM 360度环绕回环 (360 Loop - 756 帧)</option>
          <option value="data/tum/rgbd_dataset_freiburg1_room/rgb">🏢 TUM 完整大房间场景 (Room - 1362 帧)</option>
          <option value="examples/images">🎬 快速演示序列 (Demo Sample - 60 帧)</option>
        </select>
      </div>

      <div class="control-group">
        <div class="control-row">
          <label style="font-size:12px; color:var(--text-muted);">⏱️ 帧数限制</label>
          <label style="font-size:12px; color:var(--text-muted);">⏩ 抽帧步长</label>
        </div>
        <div class="btn-group">
          <select id="stream-max-frames">
            <option value="60" selected>前 60 帧 (快速体验, 推荐)</option>
            <option value="120">前 120 帧 (平滑长程)</option>
            <option value="300">前 300 帧 (大场景)</option>
            <option value="0">全部帧 (完整全长视频流)</option>
          </select>
          <select id="stream-frame-stride">
            <option value="1" selected>Stride 1 (逐帧)</option>
            <option value="2">Stride 2 (2x加速)</option>
            <option value="3">Stride 3 (3x加速)</option>
          </select>
        </div>
      </div>

      <div class="control-group" style="margin-top:4px;">
        <button class="btn-stream" id="btn-stream-toggle">▶️ 启动实时流式建图 (全部完整视频流)</button>
        <button class="view-btn" id="btn-stream-quick-view" style="margin-top:4px; display:none; background:rgba(59,130,246,0.15); border:1px solid rgba(59,130,246,0.4); color:#93c5fd;">👁️ 直接加载预览选中点云</button>
      </div>

      <div class="control-group" style="margin-top:2px;">
        <div class="control-row">
          <span style="font-size:12px; color:var(--text-muted);" id="stream-progress-text">就绪: 点击启动</span>
          <span class="val" id="stream-fps-text" style="color:#f87171;">0.0 FPS</span>
        </div>
        <div class="progress-bar-container">
          <div class="progress-bar-fill" id="stream-progress-fill"></div>
        </div>
      </div>

      <div class="control-group">
        <label style="font-size:12px; color:var(--text-muted);">建图精度 / 去重模式</label>
        <select id="dedup-mode">
          <option value="none" selected>🌟 1:1 全精细模式 (致密高清，与 PLY 100% 一致)</option>
          <option value="voxel">⚡ 空间体素去重模式 (轻量精简)</option>
        </select>
      </div>

      <div class="control-group" id="voxel-control-group" style="display:none;">
        <div class="control-row">
          <label for="voxel-size" style="font-size:12px;">体素大小 (Voxel Grid)</label>
          <span class="val" id="voxel-size-val">5.0 mm</span>
        </div>
        <input type="range" id="voxel-size" min="0.002" max="0.02" step="0.001" value="0.005">
      </div>
    </div>

    <!-- 离线对比数据源 -->
    <div class="panel-section">
      <div class="section-title">离线对比数据源</div>
      <div class="control-group">
        <select id="model-select">
          <option value="/outputs/alignment/general_fusion/fused_3_streams_normal_merged.ply" selected>🌟 [三段视频融合 推荐] 视频1+2+3 Sim(3) PGO真彩融合 (28.3万点, 15mm去重+SOR, 推荐)</option>
          <option value="/outputs/alignment/general_fusion/fused_3_streams_colored_merged.ply">🎨 [三段视频融合 双色检验] 视频1(红)+视频2(绿)+视频3(蓝) 多色标定 (推荐)</option>
          <option value="/outputs/alignment/general_fusion/fused_3_streams_normal_full.ply">🔥 [三段视频融合 全量无损] 视频1+2+3 全量高清拼接 (1199万点, 零损失)</option>
          <option value="/outputs/16_1/reconstruction.ply">📹 视频 1 - 3D点云重建 (410万点, 动态物体已滤除)</option>
          <option value="/outputs/16_2/reconstruction.ply">📹 视频 2 - 3D点云重建 (440万点, 动态物体已滤除)</option>
          <option value="/outputs/16_3/reconstruction.ply">📹 视频 3 - 3D点云重建 (348万点, 动态物体已滤除)</option>
          <option value="/outputs/alignment/data_05_08_method2_merged.ply" selected>🔥 [方案二 多模态] 视频流05-08 正常真彩融合 (341万点, 1.5cm体素去重, 推荐)</option>
          <option value="/outputs/alignment/data_05_08_method2_colored_merged.ply">🎨 [方案二 区分色彩] 视频流05-08 四色区分融合 (341万点, 红/绿/蓝/金, 推荐)</option>
          <option value="/outputs/alignment/data_05_08_method2_full_merged.ply">🌟 [方案二 多模态] 视频流05-08 正常真彩全量融合 (1401万点超高清点云, 零损失)</option>
          <option value="/outputs/alignment/data_05_08_method2_colored_full_merged.ply">🎨 [方案二 区分色彩] 视频流05-08 四色区分全量融合 (1401万点超高清点云)</option>
          <option value="/outputs/data_05_loop/reconstruction.ply">📹 视频流 05 - 点云重建 (567万点, A-B-C-B-A 循环全景)</option>
          <option value="/outputs/data_06_loop/reconstruction.ply">📹 视频流 06 - 点云重建 (271万点, C-D 右侧视角)</option>
          <option value="/outputs/data_07_loop/reconstruction.ply">📹 视频流 07 - 点云重建 (344万点, B-D 主干基准视角)</option>
          <option value="/outputs/data_08_loop/reconstruction.ply">📹 视频流 08 - 点云重建 (220万点, C-D 左侧视角)</option>
          <option value="/outputs/alignment/method2_lightglue_umeyama_full_merged.ply">🔥 [方案二 多模态] 走廊实测 视频1+视频2 全量无损拼接 (LightGlue+Umeyama, 539万点)</option>
          <option value="/outputs/alignment/method2_lightglue_umeyama_merged.ply">🌟 [方案二 多模态] 走廊实测 视频1+视频2 1.5cm去重融合 (49.3万点)</option>
          <option value="/outputs/alignment/method1_kiss_gicp_full_merged.ply">📐 [方案一 纯几何] 走廊实测 视频1+视频2 全量无损拼接 (KISS-Matcher+GICP, 539万点)</option>
          <option value="/outputs/alignment/method1_kiss_gicp_merged.ply">📐 [方案一 纯几何] 走廊实测 视频1+视频2 1.5cm去重融合 (46.4万点)</option>
          <option value="/outputs/alignment/merged.ply">🤖 [方案三 深度学习] 走廊实测 视频1+视频2 R3PM-Net全量融合 (merged.ply, 539万点)</option>
          <option value="/outputs/alignment/mine_r3pm_net_5mm_merged.ply">🤖 [方案三 深度学习] 走廊实测 视频1+视频2 5mm去重融合 (276万点)</option>
          <option value="/outputs/mine_VID20260903181931_loop/reconstruction.ply">📹 自定义视频 1 - 回环优化 (VID181931, 279万点, 走廊实测)</option>
          <option value="/outputs/mine_VID20260903181931_noloop/reconstruction.ply">📹 自定义视频 1 - 原始流式 (VID181931, 279万点)</option>
          <option value="/outputs/mine_VID20260903182041_loop/reconstruction.ply">📹 自定义视频 2 - 回环优化 (VID182041, 260万点, 走廊实测)</option>
          <option value="/outputs/mine_VID20260903182041_noloop/reconstruction.ply">📹 自定义视频 2 - 原始流式 (VID182041, 260万点)</option>
          <option value="/outputs/alignment/tum_method2_lightglue_umeyama_full_merged.ply">🔥 [TUM 方案二] 360+Desk 100%全量无损拼接 (604万超高清点云, 推荐)</option>
          <option value="/outputs/alignment/tum_method1_kiss_gicp_full_merged.ply">🔥 [TUM 方案一] 360+Desk 100%全量无损拼接 (604万超高清点云)</option>
          <option value="/outputs/alignment/tum_method2_lightglue_umeyama_merged.ply">🌟 [TUM 方案二] 360+Desk 5mm去重融合 (LightGlue+Umeyama, 222万点)</option>
          <option value="/outputs/alignment/tum_method1_kiss_gicp_merged.ply">📐 [TUM 方案一] 360+Desk 5mm去重融合 (KISS-Matcher+GICP, 226万点)</option>
          <option value="/outputs/tum_360_loop/reconstruction.ply">🔄 TUM 360环绕 - 回环优化 (333万点)</option>
          <option value="/outputs/tum_360_noloop/reconstruction.ply">🔄 TUM 360环绕 - 原始流式 (333万点)</option>
          <option value="/outputs/tum_desk_loop/reconstruction.ply">🖥️ TUM 办公桌面 - 回环优化 (270万点)</option>
          <option value="/outputs/tum_desk_noloop/reconstruction.ply">🖥️ TUM 办公桌面 - 原始流式 (270万点)</option>
          <option value="/outputs/demo_loop/reconstruction.ply">🎬 快速演示序列 - 回环优化 (52.9万点)</option>
          <option value="/outputs/demo_noloop/reconstruction.ply">🚀 快速演示序列 - 原始流式 (52.9万点)</option>
        </select>
      </div>
      <div class="control-group">
        <input type="file" id="file-input" accept=".ply">
      </div>
    </div>

    <!-- 渲染控制 -->
    <div class="panel-section">
      <div class="section-title">渲染控制</div>

  <!-- 实时 2D 摄像头 HUD (严格锁定左下角) -->
  <div class="camera-hud" id="camera-hud">

    </div>
    <img id="hud-img" src="/examples/images/000000.png" alt="Live Camera Feed">
    <div class="hud-controls" id="hud-controls" style="display:none; padding:4px 8px; background:rgba(15,23,42,0.9); border-top:1px solid rgba(255,255,255,0.1); align-items:center; justify-content:space-between; gap:6px; font-size:11px;">
      <button id="btn-hud-play" style="background:rgba(56,189,248,0.2); border:1px solid rgba(56,189,248,0.5); border-radius:4px; color:#38bdf8; cursor:pointer; font-size:11px; padding:2px 6px;">▶️ 播放</button>
      <input type="range" id="hud-frame-slider" min="0" max="0" value="0" style="flex:1; height:4px; cursor:pointer;">

  <!-- 底部操作快捷指南 -->
  <div class="help-bar">
    <div class="help-item"><span>左键拖拽</span> 旋转视角</div>
    <div class="help-item"><span>右键拖拽</span> 平移视角</div>
    <div class="help-item"><span>滚轮缩放</span> 推进/拉远</div>
    <div class="help-item"><span>快捷键 R</span> 视角归位</div>
  </div>

  <script>
    // --- 全局变量与 Three.js 场景初始化 ---
    let scene, camera, renderer, controls;
    let pointCloudMesh = null;
    let trajectoryGroup = new THREE.Group();
    let liveCameraFrustum = null;
    let trajectoryPoints = [];
    let trajectoryLine = null;
    let axesHelper, gridHelper;
    let originalBBox = null;
    let frameCount = 0, lastFpsTime = performance.now();

    // 实时流式建图状态与体素去重缓存
    let eventSource = null;
    let isStreaming = false;
    let voxelMap = new Map();
    let allPositions = [];
    let allColors = [];

    let loadedTrajectoryMatrices = [];
    let currentVideoPath = null;
    let videoTotalFrames = 0;
    let hudPlayInterval = null;
    let isHudPlaying = false;

    const container = document.getElementById('canvas-container');

    function showToast(msg, duration = 3000) {
      const toast = document.getElementById('status-toast');
      const text = document.getElementById('toast-text');
      if (toast && text) {
        text.innerText = msg;
        toast.style.display = 'flex';
        setTimeout(() => { toast.style.display = 'none'; }, duration);
      }
    }

    function initScene() {
      try {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0d1117);

        camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.01, 1000);
        camera.position.set(0.5, -0.8, -0.8);
        camera.up.set(0, -1, 0); // OpenCV/NeRF 坐标系对齐 (Y 向下, Z 向前)

        renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.screenSpacePanning = true;

        axesHelper = new THREE.AxesHelper(0.3);
        scene.add(axesHelper);

        gridHelper = new THREE.GridHelper(4, 40, 0x3b82f6, 0x1f2937);
        gridHelper.position.y = 0.5;
        scene.add(gridHelper);

        scene.add(trajectoryGroup);

        liveCameraFrustum = createCameraFrustum(0.05, 0xf59e0b);
        liveCameraFrustum.visible = false;
        scene.add(liveCameraFrustum);

        const lineGeo = new THREE.BufferGeometry();
        const lineMat = new THREE.LineBasicMaterial({ color: 0x60a5fa, linewidth: 2.5 });
        trajectoryLine = new THREE.Line(lineGeo, lineMat);
        trajectoryGroup.add(trajectoryLine);

        initDynamicPointCloud();

        const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
        scene.add(ambientLight);

        window.addEventListener('resize', onWindowResize);
        window.addEventListener('keydown', onKeyDown);
      } catch (err) {
        console.error("Three.js init error:", err);
        showToast("WebGL 初始化错误: " + err.message, 10000);
      }
    }

    function onWindowResize() {
      if (!camera || !renderer) return;
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function onKeyDown(e) {
      if (e.key === 'r' || e.key === 'R') resetView();
      if (e.key === 't' || e.key === 'T') setTopView();
      if (e.key === 'f' || e.key === 'F') setFrontView();
      if (e.key === 's' || e.key === 'S') setSideView();
    }

    function createCameraFrustum(scale = 0.035, color = 0x38bdf8) {
      const group = new THREE.Group();
      const w = scale * 0.8, h = scale * 0.5, d = scale * 1.2;
      const vertices = new Float32Array([
        0, 0, 0,  -w, -h, d,
        0, 0, 0,   w, -h, d,
        0, 0, 0,   w,  h, d,
        0, 0, 0,  -w,  h, d,
        -w, -h, d,  w, -h, d,
         w, -h, d,  w,  h, d,
         w,  h, d, -w,  h, d,
        -w,  h, d, -w, -h, d,
        0, -h * 1.3, d,  -w * 0.4, -h, d,
        0, -h * 1.3, d,   w * 0.4, -h, d
      ]);
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
      const mat = new THREE.LineBasicMaterial({ color: color, linewidth: 1.5 });
      group.add(new THREE.LineSegments(geo, mat));
      return group;
    }

    function initDynamicPointCloud() {
      if (pointCloudMesh) {
        scene.remove(pointCloudMesh);
        pointCloudMesh.geometry.dispose();
        pointCloudMesh.material.dispose();
      }

      const geometry = new THREE.BufferGeometry();
      const initialCapacity = 2000000;
      const posBuffer = new Float32Array(initialCapacity * 3);
      const colBuffer = new Float32Array(initialCapacity * 3);

      geometry.setAttribute('position', new THREE.BufferAttribute(posBuffer, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(colBuffer, 3));
      geometry.setDrawRange(0, 0);

      const size = parseFloat(document.getElementById('point-size').value);
      const material = new THREE.PointsMaterial({
        size: size,
        vertexColors: true,
        sizeAttenuation: true,
        transparent: true,
        opacity: 0.95
      });

      pointCloudMesh = new THREE.Points(geometry, material);
      scene.add(pointCloudMesh);
    }

    function appendPointsWithVoxelGrid(newPoints, newColors) {
      const dedupMode = document.getElementById('dedup-mode').value;

      if (dedupMode === 'none') {
        for (let i = 0; i < newPoints.length; i++) {
          allPositions.push(newPoints[i][0], newPoints[i][1], newPoints[i][2]);
          allColors.push(newColors[i][0] / 255.0, newColors[i][1] / 255.0, newColors[i][2] / 255.0);
        }
      } else {
        const voxelSize = parseFloat(document.getElementById('voxel-size').value);
        const invVoxel = 1.0 / voxelSize;
        for (let i = 0; i < newPoints.length; i++) {
          const x = newPoints[i][0], y = newPoints[i][1], z = newPoints[i][2];
          const vx = Math.round(x * invVoxel);
          const vy = Math.round(y * invVoxel);
          const vz = Math.round(z * invVoxel);
          const key = `${vx}_${vy}_${vz}`;

          if (!voxelMap.has(key)) {
            voxelMap.set(key, true);
            allPositions.push(x, y, z);
            allColors.push(newColors[i][0] / 255.0, newColors[i][1] / 255.0, newColors[i][2] / 255.0);
          }
        }
      }

      const totalPoints = allPositions.length / 3;
      const geo = pointCloudMesh.geometry;
      let posAttr = geo.attributes.position;
      let colAttr = geo.attributes.color;

      if (posAttr.array.length < allPositions.length) {
        const newCapacity = Math.max(allPositions.length * 2, 6000000);
        const newPosBuf = new Float32Array(newCapacity);
        const newColBuf = new Float32Array(newCapacity);
        newPosBuf.set(allPositions);
        newColBuf.set(allColors);
        geo.setAttribute('position', new THREE.BufferAttribute(newPosBuf, 3));
        geo.setAttribute('color', new THREE.BufferAttribute(newColBuf, 3));
        posAttr = geo.attributes.position;
        colAttr = geo.attributes.color;
      } else {
        posAttr.copyArray(allPositions);
        colAttr.copyArray(allColors);
      }

      posAttr.needsUpdate = true;
      colAttr.needsUpdate = true;
      geo.setDrawRange(0, totalPoints);

      geo.computeBoundingBox();
      originalBBox = geo.boundingBox;

      document.getElementById('stat-points').innerText = totalPoints.toLocaleString();
      if (originalBBox) {
        const dim = new THREE.Vector3();
        originalBBox.getSize(dim);
        document.getElementById('stat-bbox').innerText = `${dim.x.toFixed(2)} × ${dim.y.toFixed(2)} × ${dim.z.toFixed(2)} m`;
        gridHelper.position.y = originalBBox.max.y + 0.1;
      }
    }

    function updateStreamButtonLabel() {
      const maxFrames = parseInt(document.getElementById('stream-max-frames').value, 10);
      const btn = document.getElementById('btn-stream-toggle');
      const quickBtn = document.getElementById('btn-stream-quick-view');
      const sel = document.getElementById('stream-sequence-select');
      const val = sel ? sel.value : '';
      const isPly = val.endsWith('.ply');

      if (quickBtn) {
        quickBtn.style.display = isPly ? 'block' : 'none';
      }

      if (!isStreaming && btn) {
        if (isPly) {
          if (maxFrames === 0) {
            btn.innerText = `▶️ 启动实时流式建图 (完整点云流)`;
          } else {
            btn.innerText = `▶️ 启动实时流式建图 (前 ${maxFrames} 帧点云流)`;
          }
        } else {
          if (maxFrames === 0) {
            btn.innerText = `▶️ 启动实时流式建图 (全部完整视频流)`;
          } else {
            btn.innerText = `▶️ 启动实时流式建图 (前 ${maxFrames} 帧)`;
          }
        }
      }
    }

    async function startLiveStream() {
      if (isStreaming) {
        stopLiveStream();
        return;
      }

      if (eventSource) {
        eventSource.close();
        eventSource = null;
      }

      try {
        await fetch('/api/stop');
      } catch (err) {}

      voxelMap.clear();
      allPositions = [];
      allColors = [];
      trajectoryPoints = [];
      trajectoryGroup.clear();
      trajectoryGroup.add(trajectoryLine);
      initDynamicPointCloud();

      isStreaming = true;
      const btn = document.getElementById('btn-stream-toggle');
      btn.innerText = '⏹️ 停止实时建图';
      btn.classList.add('running');
      document.getElementById('live-indicator').style.display = 'inline-block';
      liveCameraFrustum.visible = true;

      const seq = document.getElementById('stream-sequence-select').value;
      const maxFrames = document.getElementById('stream-max-frames').value;
      const frameStride = document.getElementById('stream-frame-stride').value;
      const confThresh = 0.1;
      const pointStride = 4;
      const url = `/api/stream?sequence=${encodeURIComponent(seq)}&max_frames=${maxFrames}&stride=${frameStride}&point_stride=${pointStride}&confidence_threshold=${confThresh}`;
      document.getElementById('stream-progress-text').innerText = '正在排队/启动引擎...';
      eventSource = new EventSource(url);
      eventSource.onerror = () => {
        if (isStreaming) {
          console.warn("EventSource disconnected or closed");
          stopLiveStream();
        }
      };
      function handleFramePayload(data) {
        if (data.thumbnail) {
          document.getElementById('hud-img').src = data.thumbnail;
        } else if (data.image_url) {
          document.getElementById('hud-img').src = data.image_url;
        }
        document.getElementById('hud-frame-tag').innerText = `帧 #${data.frame_index + 1} (${data.point_count} 点)`;

        const p = data.camera_pose;
        const mat = new THREE.Matrix4().set(
          p[0][0], p[0][1], p[0][2], p[0][3],
          p[1][0], p[1][1], p[1][2], p[1][3],
          p[2][0], p[2][1], p[2][2], p[2][3],
          0, 0, 0, 1
        );
        liveCameraFrustum.matrixAutoUpdate = false;
        liveCameraFrustum.matrix.copy(mat);

        const currentPos = new THREE.Vector3(p[0][3], p[1][3], p[2][3]);
        trajectoryPoints.push(currentPos);

        if (data.frame_index % 3 === 0 || data.frame_index === data.total_frames - 1) {
          const frustum = createCameraFrustum(0.035, 0x38bdf8);
          frustum.matrixAutoUpdate = false;
          frustum.matrix.copy(mat);
          trajectoryGroup.add(frustum);
        }

        trajectoryLine.geometry.setFromPoints(trajectoryPoints);
        trajectoryLine.geometry.attributes.position.needsUpdate = true;

        appendPointsWithVoxelGrid(data.points_xyz, data.points_rgb);

        if (document.getElementById('chk-follow-camera').checked) {
          controls.target.lerp(currentPos, 0.2);
        }

        const progress = ((data.frame_index + 1) / data.total_frames) * 100;
        document.getElementById('stream-progress-fill').style.width = `${progress}%`;
        document.getElementById('stream-progress-text').innerText = `建图中: ${data.frame_index + 1} / ${data.total_frames} 帧`;
        document.getElementById('stream-fps-text').innerText = `${data.fps.toFixed(1)} FPS`;
        document.getElementById('stat-latency').innerText = `${data.latency_ms} ms (${data.fps.toFixed(1)} FPS)`;
      }

      eventSource.addEventListener('start', (e) => {
        const data = JSON.parse(e.data);
        document.getElementById('stream-progress-text').innerText = `建图中: 0 / ${data.total_frames} 帧`;
      });

      eventSource.addEventListener('frame', (e) => {
        handleFramePayload(JSON.parse(e.data));
      });

      eventSource.onmessage = (e) => {
        try {
          const data = JSON.parse(e.data);
          if (data.frame_index !== undefined) handleFramePayload(data);
        } catch(err) {}
      };

      eventSource.addEventListener('complete', (e) => {
        const data = JSON.parse(e.data);
        document.getElementById('stream-progress-text').innerText = `✅ 建图完成: ${data.total_frames} 帧全部处理`;
        showToast(`✅ 建图完成: ${data.total_frames} 帧处理完毕，共生成 ${allPositions.length/3} 个空间点`);
        stopLiveStream();
        resetView();
      });

      eventSource.onerror = (err) => {
        if (isStreaming) {
          console.warn("SSE stream finished or closed.");
          stopLiveStream();
        }
      };
    }

    function stopLiveStream() {
      if (eventSource) {
        eventSource.close();
        eventSource = null;
      }
      fetch('/api/stop').catch(() => {});
      isStreaming = false;
      const btn = document.getElementById('btn-stream-toggle');
      if (btn) {
        updateStreamButtonLabel();
        btn.classList.remove('running');
      }
      document.getElementById('live-indicator').style.display = 'none';
      if (liveCameraFrustum) liveCameraFrustum.visible = false;
    }

    function parseNpy(buffer) {
      const u8 = new Uint8Array(buffer);
      if (u8[0] !== 0x93 || u8[1] !== 0x4E || u8[2] !== 0x55 || u8[3] !== 0x4D || u8[4] !== 0x50 || u8[5] !== 0x59) {
        throw new Error("Invalid NPY format");
      }
      const major = u8[6];
      const headerOffset = major >= 2 ? 12 : 10;
      let headerLen = u8[8] | (u8[9] << 8);
      if (major >= 2) {
        headerLen = (u8[8] | (u8[9] << 8) | (u8[10] << 16) | (u8[11] << 24)) >>> 0;
      }
      const dataOffset = headerOffset + headerLen;
      const headerStr = new TextDecoder('latin1').decode(u8.subarray(headerOffset, dataOffset));

      const descrMatch = headerStr.match(/'descr'\s*:\s*'([^']+)'/);
      const descr = descrMatch ? descrMatch[1] : '<f4';

      if (descr.includes('f8') || descr.includes('float64')) {
        const f64 = new Float64Array(buffer.slice(dataOffset));
        const f32 = new Float32Array(f64.length);
        for (let i = 0; i < f64.length; i++) {
          f32[i] = f64[i];
        }
        return f32;
      } else {
        return new Float32Array(buffer.slice(dataOffset));
      }
    }

    async function loadTrajectory(url) {
      trajectoryGroup.clear();
      loadedTrajectoryMatrices = [];
      const candidates = [];

      // 1. Specific pose files derived directly from the model filename
      candidates.push(url.replace(/\.ply$/i, '_poses.npy'));
      candidates.push(url.replace(/\.ply$/i, '_camera_poses.npy'));
      candidates.push(url.replace(/\.ply$/i, '.poses.npy'));

      // 2. Only if the PLY is a reconstruction file (e.g. reconstruction.ply),
      // check the standard sequence reconstruction pose candidates in its directory
      const isReconstruction = /reconstruction/i.test(url);
      const parentDir = url.substring(0, url.lastIndexOf('/') + 1);
      if (isReconstruction) {
        candidates.push(url.replace(/reconstruction.*\.ply$/i, 'camera_poses.npy'));
        candidates.push(url.replace(/reconstruction.*\.ply$/i, 'camera_poses_loop.npy'));
        candidates.push(url.replace(/reconstruction.*\.ply$/i, 'camera_poses_noloop.npy'));
        candidates.push(parentDir + 'camera_poses.npy');
        candidates.push(parentDir + 'camera_poses_loop.npy');
        candidates.push(parentDir + 'camera_poses_noloop.npy');
      }

      for (const trajUrl of candidates) {
        try {
          const resp = await fetch(trajUrl);
          if (!resp.ok) continue;

          const buffer = await resp.arrayBuffer();
          const floatData = parseNpy(buffer);
          const numPoses = Math.floor(floatData.length / 16);
          if (numPoses <= 0) continue;

          const points = [];
          const frustumStride = numPoses > 150 ? Math.ceil(numPoses / 60) : 2;
          for (let i = 0; i < numPoses; i++) {
            const off = i * 16;

            // Verify that all matrix values are finite and within reasonable spatial coordinates
            let isValid = true;
            for (let k = 0; k < 16; k++) {
              const val = floatData[off + k];
              if (!Number.isFinite(val) || Math.abs(val) > 1e4) {
                isValid = false;
                break;
              }
            }
            if (!isValid) continue;

            const mat = new THREE.Matrix4().set(
              floatData[off], floatData[off+1], floatData[off+2], floatData[off+3],
              floatData[off+4], floatData[off+5], floatData[off+6], floatData[off+7],
              floatData[off+8], floatData[off+9], floatData[off+10], floatData[off+11],
              0, 0, 0, 1
            );
            loadedTrajectoryMatrices.push(mat);
            const pos = new THREE.Vector3(floatData[off+3], floatData[off+7], floatData[off+11]);
            points.push(pos);

            if (i % frustumStride === 0 || i === numPoses - 1) {
              const isFirstOrLast = (i === 0 || i === numPoses - 1);
              const frustum = createCameraFrustum(0.04, isFirstOrLast ? 0xf59e0b : 0x38bdf8);
              frustum.matrixAutoUpdate = false;
              frustum.matrix.copy(mat);
              trajectoryGroup.add(frustum);
            }
          }

          if (points.length > 0) {
            const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
            const lineMat = new THREE.LineBasicMaterial({ color: 0x60a5fa, linewidth: 2.5 });
            const line = new THREE.Line(lineGeo, lineMat);
            trajectoryGroup.add(line);
          }
          break;
        } catch (err) {
          // continue to next candidate
        }
      }
    }

    function syncCameraPoseToFrame(frameIndex) {
      if (!liveCameraFrustum || !loadedTrajectoryMatrices || loadedTrajectoryMatrices.length === 0) return;
      const pIdx = Math.min(frameIndex, loadedTrajectoryMatrices.length - 1);
      const mat = loadedTrajectoryMatrices[pIdx];
      liveCameraFrustum.visible = true;
      liveCameraFrustum.matrixAutoUpdate = false;
      liveCameraFrustum.matrix.copy(mat);
    }

    async function checkAndSetupVideoHUD(modelPath) {
      if (hudPlayInterval) {
        clearInterval(hudPlayInterval);
        hudPlayInterval = null;
        isHudPlaying = false;
        const btn = document.getElementById('btn-hud-play');
        if (btn) btn.innerText = '▶️ 播放';
      }

      const hudControls = document.getElementById('hud-controls');
      const hudImg = document.getElementById('hud-img');
      const hudTag = document.getElementById('hud-frame-tag');
      const slider = document.getElementById('hud-frame-slider');
      const countLabel = document.getElementById('hud-frame-count');

      try {
        const cleanPath = modelPath.startsWith('/') ? modelPath.slice(1) : modelPath;
        const resp = await fetch(`/api/video_info?path=${encodeURIComponent(cleanPath)}`);
        if (!resp.ok) return;
        const data = await resp.json();
        if (data.has_video && data.total_frames > 0) {
          currentVideoPath = cleanPath;
          videoTotalFrames = data.total_frames;
          if (hudControls) hudControls.style.display = 'flex';
          if (slider) {
            slider.max = data.total_frames - 1;
            slider.value = 0;
          }
          if (countLabel) countLabel.innerText = `1/${data.total_frames}`;
          if (hudTag) hudTag.innerText = `帧 #1 / ${data.total_frames} (${data.format === 'colors.pt' ? 'colors.pt 视频流' : '图像帧'})`;
          if (hudImg) hudImg.src = `/api/frame?path=${encodeURIComponent(cleanPath)}&frame=0`;
        } else {
          currentVideoPath = null;
          videoTotalFrames = 0;
          if (hudControls) hudControls.style.display = 'none';
        }
      } catch (e) {
        console.warn("Failed to check video info:", e);
      }
    }

    function setupHudControls() {
      const slider = document.getElementById('hud-frame-slider');
      const playBtn = document.getElementById('btn-hud-play');
      const hudImg = document.getElementById('hud-img');
      const hudTag = document.getElementById('hud-frame-tag');
      const countLabel = document.getElementById('hud-frame-count');

      if (slider) {
        slider.addEventListener('input', (e) => {
          if (!currentVideoPath) return;
          const f = parseInt(e.target.value, 10);
          if (hudImg) hudImg.src = `/api/frame?path=${encodeURIComponent(currentVideoPath)}&frame=${f}`;
          if (hudTag) hudTag.innerText = `帧 #${f + 1} / ${videoTotalFrames} (视频流)`;
          if (countLabel) countLabel.innerText = `${f + 1}/${videoTotalFrames}`;
          syncCameraPoseToFrame(f);
        });
      }

      if (playBtn) {
        playBtn.addEventListener('click', () => {
          if (!currentVideoPath || videoTotalFrames <= 1) return;
          if (isHudPlaying) {
            clearInterval(hudPlayInterval);
            hudPlayInterval = null;
            isHudPlaying = false;
            playBtn.innerText = '▶️ 播放';
          } else {
            isHudPlaying = true;
            playBtn.innerText = '⏸️ 暂停';
            hudPlayInterval = setInterval(() => {
              let f = parseInt(slider.value, 10) + 1;
              if (f >= videoTotalFrames) f = 0;
              slider.value = f;
              if (hudImg) hudImg.src = `/api/frame?path=${encodeURIComponent(currentVideoPath)}&frame=${f}`;
              if (hudTag) hudTag.innerText = `帧 #${f + 1} / ${videoTotalFrames} (视频流播放中)`;
              if (countLabel) countLabel.innerText = `${f + 1}/${videoTotalFrames}`;
              syncCameraPoseToFrame(f);
            }, 100);
          }
        });
      }
    }

    function parseBinaryPLY(buffer) {
      const headerText = new TextDecoder('latin1').decode(new Uint8Array(buffer, 0, Math.min(2048, buffer.byteLength)));
      const headerEndIndex = headerText.indexOf('end_header\n');
      if (headerEndIndex === -1) throw new Error("无法解析 PLY 文件头: 未找到 end_header");

      const header = headerText.slice(0, headerEndIndex);
      const lines = header.split('\n');
      let vertexCount = 0;
      let properties = [];
      let inVertex = false;

      for (const line of lines) {
        const parts = line.trim().split(/\s+/);
        if (parts[0] === 'element' && parts[1] === 'vertex') {
          vertexCount = parseInt(parts[2], 10);
          inVertex = true;
        } else if (parts[0] === 'element' && parts[1] !== 'vertex') {
          inVertex = false;
        } else if (inVertex && parts[0] === 'property') {
          properties.push({ type: parts[1], name: parts[2] });
        }
      }

      const bodyOffset = headerEndIndex + 'end_header\n'.length;
      const dataView = new DataView(buffer, bodyOffset);

      const positions = new Float32Array(vertexCount * 3);
      const colors = new Float32Array(vertexCount * 3);

      let stride = 0;
      let xOff = -1, yOff = -1, zOff = -1;
      let rOff = -1, gOff = -1, bOff = -1;

      for (const p of properties) {
        if (p.name === 'x') xOff = stride;
        if (p.name === 'y') yOff = stride;
        if (p.name === 'z') zOff = stride;
        if (p.name === 'red') rOff = stride;
        if (p.name === 'green') gOff = stride;
        if (p.name === 'blue') bOff = stride;

        if (p.type === 'float') stride += 4;
        else if (p.type === 'uchar' || p.type === 'uint8') stride += 1;
        else if (p.type === 'int' || p.type === 'uint' || p.type === 'int32') stride += 4;
        else if (p.type === 'short' || p.type === 'ushort') stride += 2;
        else if (p.type === 'double') stride += 8;
      }
      const isDouble = properties.some(p => (p.name === 'x' || p.name === 'y' || p.name === 'z') && p.type === 'double');
      let offset = 0;
      for (let i = 0; i < vertexCount; i++) {
        const pIdx = i * 3;
        if (isDouble) {
          positions[pIdx] = dataView.getFloat64(offset + xOff, true);
          positions[pIdx + 1] = dataView.getFloat64(offset + yOff, true);
          positions[pIdx + 2] = dataView.getFloat64(offset + zOff, true);
        } else {
          positions[pIdx] = dataView.getFloat32(offset + xOff, true);
          positions[pIdx + 1] = dataView.getFloat32(offset + yOff, true);
          positions[pIdx + 2] = dataView.getFloat32(offset + zOff, true);
        }

        if (rOff !== -1) {
          colors[pIdx] = dataView.getUint8(offset + rOff) / 255.0;
          colors[pIdx + 1] = dataView.getUint8(offset + gOff) / 255.0;
          colors[pIdx + 2] = dataView.getUint8(offset + bOff) / 255.0;
        } else {
          colors[pIdx] = 0.8; colors[pIdx + 1] = 0.8; colors[pIdx + 2] = 0.8;
        }
        offset += stride;
      }

      return { positions, colors, vertexCount };
    }

    async function loadPLYFromUrl(url) {
      stopLiveStream();
      showToast(`正在加载 ${url.split('/').slice(-2, -1)[0]} 点云...`);
      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        const buffer = await response.arrayBuffer();
        
        const parsed = parseBinaryPLY(buffer);
        
        allPositions = Array.from(parsed.positions);
        allColors = Array.from(parsed.colors);
        voxelMap.clear();

        const newGeo = new THREE.BufferGeometry();
        newGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(parsed.positions), 3));
        newGeo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(parsed.colors), 3));
        newGeo.setDrawRange(0, parsed.vertexCount);
        newGeo.computeBoundingBox();
        if (pointCloudMesh.geometry) {
          pointCloudMesh.geometry.dispose();
        }
        pointCloudMesh.geometry = newGeo;
        originalBBox = newGeo.boundingBox;

        document.getElementById('stat-points').innerText = parsed.vertexCount.toLocaleString();
        if (originalBBox) {
          const dim = new THREE.Vector3();
          originalBBox.getSize(dim);
          document.getElementById('stat-bbox').innerText = `${dim.x.toFixed(2)} × ${dim.y.toFixed(2)} × ${dim.z.toFixed(2)} m`;
          gridHelper.position.y = originalBBox.max.y + 0.1;
        }

        await loadTrajectory(url);
        await checkAndSetupVideoHUD(url);
        resetView();
        showToast(`✅ 已成功加载 ${parsed.vertexCount.toLocaleString()} 个三维空间点`);
      } catch (err) {
        alert("加载点云失败: " + err.message);
      }
    }

    function exportCurrentPLY() {
      const count = allPositions.length / 3;
      if (count === 0) {
        alert("当前没有点云数据可导出");
        return;
      }

      const header = `ply\nformat binary_little_endian 1.0\ncomment Exported from ABot-Recon Live Streaming Viewer\nelement vertex ${count}\nproperty float x\nproperty float y\nproperty float z\nproperty uchar red\nproperty uchar green\nproperty uchar blue\nend_header\n`;
      const headerBytes = new TextEncoder().encode(header);
      const vertexBytes = new Uint8Array(count * 15);
      const dataView = new DataView(vertexBytes.buffer);

      let offset = 0;
      for (let i = 0; i < count; i++) {
        const pIdx = i * 3;
        dataView.setFloat32(offset, allPositions[pIdx], true);
        dataView.setFloat32(offset + 4, allPositions[pIdx + 1], true);
        dataView.setFloat32(offset + 8, allPositions[pIdx + 2], true);
        dataView.setUint8(offset + 12, Math.round(allColors[pIdx] * 255));
        dataView.setUint8(offset + 13, Math.round(allColors[pIdx + 1] * 255));
        dataView.setUint8(offset + 14, Math.round(allColors[pIdx + 2] * 255));
        offset += 15;
      }

      const blob = new Blob([headerBytes, vertexBytes], { type: 'application/octet-stream' });
      const a = document.createElement('a');
      a.download = `abot_recon_live_${count}_points.ply`;
      a.href = URL.createObjectURL(blob);
      a.click();
    }

    function getBoxDimensions() {
      if (!originalBBox) return { center: new THREE.Vector3(), maxDim: 1.0, dim: new THREE.Vector3(1, 1, 1) };
      const center = new THREE.Vector3();
      const dim = new THREE.Vector3();
      originalBBox.getCenter(center);
      originalBBox.getSize(dim);
      const maxDim = Math.max(dim.x, dim.y, dim.z, 0.5);
      return { center, maxDim, dim };
    }

    function resetView() {
      const { center, maxDim } = getBoxDimensions();
      controls.target.copy(center);
      camera.position.set(center.x + maxDim * 0.35, center.y - maxDim * 0.55, center.z - maxDim * 0.85);
      camera.up.set(0, -1, 0);
      camera.lookAt(center);
      controls.update();
    }

    function setFrontView() {
      const { center, maxDim } = getBoxDimensions();
      controls.target.copy(center);
      camera.position.set(center.x, center.y, center.z - maxDim * 1.1);
      camera.up.set(0, -1, 0);
      camera.lookAt(center);
      controls.update();
    }

    function setTopView() {
      const { center, maxDim } = getBoxDimensions();
      controls.target.copy(center);
      camera.position.set(center.x, center.y - maxDim * 1.3, center.z);
      camera.up.set(0, 0, 1);
      camera.lookAt(center);
      controls.update();
    }

    function setSideView() {
      const { center, maxDim } = getBoxDimensions();
      controls.target.copy(center);
      camera.position.set(center.x + maxDim * 1.2, center.y, center.z);
      camera.up.set(0, -1, 0);
      camera.lookAt(center);
      controls.update();
    }

    // --- 事件绑定 ---
    document.getElementById('btn-stream-toggle').addEventListener('click', startLiveStream);

    document.getElementById('dedup-mode').addEventListener('change', (e) => {
      const isVoxel = e.target.value === 'voxel';
      document.getElementById('voxel-control-group').style.display = isVoxel ? 'flex' : 'none';
    });

    document.getElementById('voxel-size').addEventListener('input', (e) => {
      const v = parseFloat(e.target.value);
      document.getElementById('voxel-size-val').innerText = `${(v * 100).toFixed(1)} cm`;
    });

    document.getElementById('stream-sequence-select').addEventListener('change', (e) => {
      updateStreamButtonLabel();
      checkAndSetupVideoHUD(e.target.value);
    });
    document.getElementById('stream-max-frames').addEventListener('change', updateStreamButtonLabel);
    const quickBtn = document.getElementById('btn-stream-quick-view');
    if (quickBtn) {
      quickBtn.addEventListener('click', () => {
        const sel = document.getElementById('stream-sequence-select');
        if (sel && sel.value) {
          const url = sel.value.startsWith('/') ? sel.value : '/' + sel.value;
          const modelSel = document.getElementById('model-select');
          if (modelSel) {
            for (let opt of modelSel.options) {
              if (opt.value === url) {
                modelSel.value = url;
                break;
              }
            }
          }
          loadPLYFromUrl(url);
        }
      });
    }


    document.getElementById('model-select').addEventListener('change', (e) => {
      loadPLYFromUrl(e.target.value);
    });

    document.getElementById('file-input').addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = (evt) => {
          const parsed = parseBinaryPLY(evt.target.result);
          allPositions = Array.from(parsed.positions);
          allColors = Array.from(parsed.colors);
          voxelMap.clear();
          const geo = pointCloudMesh.geometry;
          geo.attributes.position.copyArray(parsed.positions);
          geo.attributes.color.copyArray(parsed.colors);
          geo.attributes.position.needsUpdate = true;
          geo.attributes.color.needsUpdate = true;
          geo.setDrawRange(0, parsed.vertexCount);
          geo.computeBoundingBox();
          originalBBox = geo.boundingBox;
          document.getElementById('stat-points').innerText = parsed.vertexCount.toLocaleString();
          resetView();
        };
        reader.readAsArrayBuffer(file);
      }
    });

      setupHudControls();
    document.getElementById('point-size').addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      document.getElementById('point-size-val').innerText = val.toFixed(3);
      if (pointCloudMesh) pointCloudMesh.material.size = val;
    });

    document.getElementById('chk-trajectory').addEventListener('change', (e) => {
      trajectoryGroup.visible = e.target.checked;
    });

    document.getElementById('chk-axes').addEventListener('change', (e) => {
      axesHelper.visible = e.target.checked;
    });

    document.getElementById('chk-grid').addEventListener('change', (e) => {
      gridHelper.visible = e.target.checked;
    });

    document.getElementById('btn-view-reset').addEventListener('click', resetView);
    document.getElementById('btn-view-front').addEventListener('click', setFrontView);
    document.getElementById('btn-view-top').addEventListener('click', setTopView);
    document.getElementById('btn-view-side').addEventListener('click', setSideView);
    document.getElementById('btn-export-ply').addEventListener('click', exportCurrentPLY);

    document.getElementById('btn-screenshot').addEventListener('click', () => {
      renderer.render(scene, camera);
      const dataUrl = renderer.domElement.toDataURL('image/png');
      const a = document.createElement('a');
      a.download = `abot_recon_${Date.now()}.png`;
      a.href = dataUrl;
      a.click();
    });

    function animate(time) {
      requestAnimationFrame(animate);
      if (controls) controls.update();
      if (renderer && scene && camera) renderer.render(scene, camera);

      frameCount++;
      if (time - lastFpsTime >= 1000) {
        document.getElementById('stat-fps').innerText = `${frameCount} FPS`;
        frameCount = 0;
        lastFpsTime = time;
      }
    }

    function startApp() {
      initScene();
      animate(performance.now());

      fetch('/api/sequences')
        .then(r => r.json())
        .then(seqs => {
          if (seqs && seqs.length > 0) {
            const sel = document.getElementById('stream-sequence-select');
            sel.innerHTML = '';
            const groups = {};
            seqs.forEach(item => {
              const cat = item.category || '其它数据源';
              if (!groups[cat]) {
                const grp = document.createElement('optgroup');
                grp.label = cat;
                groups[cat] = grp;
                sel.appendChild(grp);
              }
              const opt = document.createElement('option');
              opt.value = item.id;
              opt.innerText = item.name;
              if (item.type) opt.dataset.type = item.type;
              groups[cat].appendChild(opt);
            });
            updateStreamButtonLabel();
          }
        })
        .catch(err => console.warn("Failed to load sequences list:", err));

      fetch('/api/offline_models')
        .then(r => r.json())
        .then(models => {
          if (models && models.length > 0) {
            const sel = document.getElementById('model-select');
            sel.innerHTML = '';
            const groups = {};
            models.forEach(m => {
              const cat = m.category || '全部点云模型';
              if (!groups[cat]) {
                const grp = document.createElement('optgroup');
                grp.label = cat;
                groups[cat] = grp;
                sel.appendChild(grp);
              }
              const opt = document.createElement('option');
              opt.value = m.url;
              opt.innerText = m.name;
              groups[cat].appendChild(opt);
            });
            if (sel.options.length > 0) {
              let defaultOpt = sel.options[0];
              for (let opt of sel.options) {
                if (opt.value.includes('fused_3_streams_normal_merged.ply')) {
                  defaultOpt = opt;
                  break;
                }
              }
              sel.value = defaultOpt.value;
              loadPLYFromUrl(defaultOpt.value);
            }
          }
        })
        .catch(err => console.warn("Failed to load offline models list:", err));
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', startApp);
    } else {
      startApp();
    }
  </script>
</body>
</html>
